<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array of Numbers (Sum, Max, Min)</title>

    <style>
        span {
            margin-left: 20px;
        }

        #sum {
            font-weight: bold;
            color: blue;
        }

        #max {
            font-weight: bold;
            color: green;
        }

        #min {
            font-weight: bold;
            color: red;
        }
    </style>
</head>
<body>
    <h1>JS Exercise 3</h1>
    <table>
        <tr>
            <td>
                <label for="number">Enter a number:</label>
            </td>
            <td>
                <input type="number" name="number" id="number" placeholder="Enter a number">
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <button onclick="insertArray()">Insert</button>
                <button onclick="clearEntries()">Clear All</button>
            </td>
        </tr>
    </table>
    <p style="font-weight: bold;">Numbers</p>
    <p id="numbers"></p>

    <table>
        <tr>
            <td>
                Sum:
            </td>
            <td>
                <span id="sum"></span>
            </td>
        </tr>
        <tr>
            <td>
                Highest:
            </td>
            <td>
                <span id="max"></span>
            </td>
        </tr>
        <tr>
            <td>
                Lowest:
            </td>
            <td>
                <span id="min"></span>
            </td>
        </tr>
    </table>
    <script src="main.js"></script>
</body>
</html>
